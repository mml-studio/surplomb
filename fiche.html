<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <!--
    THE PAGE'S LANGUAGE, DECIDED BEFORE ANYTHING IS DRAWN.

    A VERBATIM COPY of the `/* locale-gate */` script in `index.html` — same
    order, same storage key, same flag — because this sheet is a second
    document of the same application and a reader who chose English on the
    globe must not meet a French page inside its own iframe. The rule and its
    reasons live in `src/i18n/locale.js`; `src/i18n/locale.test.mjs` RUNS BOTH
    copies against `resolveLocale()` over a matrix of inputs and fails when
    either one drifts.

    The globe passes `?lang=` on the iframe URL when it is not French
    (`src/data/ficheSheet.js`); a reader who opens this page directly is
    covered by the stored choice.
  -->
  <script>
    /* locale-gate */
    (function () {
      var KEY = 'gev:locale:v1';
      var AUTO = true;
      var pick = function (value) {
        var tag = typeof value === 'string' ? value.toLowerCase().split(/[-_]/)[0] : '';
        return tag === 'fr' || tag === 'en' ? tag : null;
      };
      var locale = pick(window.__GEV_LOCALE__);
      if (!locale) {
        locale = pick(new URLSearchParams(location.search).get('lang'));
        if (locale) {
          try { window.localStorage.setItem(KEY, locale); } catch (e) { /* no storage */ }
        }
      }
      if (!locale) {
        try { locale = pick(window.localStorage.getItem(KEY)); } catch (e) { /* no storage */ }
      }
      if (!locale && AUTO) {
        var list = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
        for (var i = 0; i < list.length && !locale; i += 1) locale = pick(list[i]);
        locale = locale || 'en';
      }
      document.documentElement.setAttribute('lang', locale || 'fr');
    })();
  </script>
  <!--
    THE APP'S FONTS, SERVED FROM THIS ORIGIN.

    This sheet has declared `var(--font-mono)` and `var(--font-sans)` from the
    start and never loaded them: it fell back to the system stack, so to Times
    inside an iframe on the globe's sheet, next to an interface in Inter and
    JetBrains Mono. Same path as `index.html:153` — four faces and the icon
    subset, from this origin, never from Google.
  -->
  <link rel="stylesheet" href="/fonts/fonts.css">
  <title data-i18n="page.title">Radiographie d'adresse</title>
  <!--
    THE ADDRESS X-RAY — one address, ten themes, one sheet.

        /fiche.html?lat=48.83&lon=2.376
        /fiche.html?q=13 rue du Chevaleret, Paris
        /fiche.html?lat=…&lon=…&embed=1      ← without header or footer

    WHY A SEPARATE PAGE, AND NOT A PANEL IN THE GLOBE. Three reasons, in this
    order:

    1. The globe's overlay card shows only six lines (`.slice(0, 6)` in
       `addressScanLayer.js`, and that is the right choice for a label set on
       a door). Ten themes make about sixty.
    2. What Cityscan sells is not a map: it is a DOCUMENT. A printable page is
       the format of the product being copied, not a stopgap.
    3. `?embed=1` and `Ctrl+P` cover, without a line of backend, the two
       offers at €50 and €30/month noted during the teardown — the property
       valuation and the lead capture.

    NO CESIUM HERE. The page loads neither globe nor tiles: it calls the
    seventeen routes of `adresseRadiographie.js` and composes text. That is
    what makes it printable, embeddable in an iframe, and readable on an
    estate agency's phone.

    PRINTING. The `@media print` CSS turns the background white and the ink
    black, avoids breaks in the middle of a theme and prints the source URL.
    “Print → Save as PDF” is enough: no embedded PDF engine, so nothing to
    maintain and nothing to load.
  -->
  <style>
    :root {
      --font-sans: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', ui-monospace, monospace;
      --ink: #10151d;
      --ink-dim: #55606f;
      --ink-faint: #8a93a1;
      --rule: #dfe4ea;
      --paper: #ffffff;
      /* Belvédère paper: the home page's ivory around the sheet, its green for
         links and buttons. The sheet itself stays white so it prints. */
      --tint: #f7f4ea;
      --accent: #24473c;
      --warn: #9a5b00;
      --absent: #a03028;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--tint);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .sheet {
      max-width: 46rem;
      margin: 0 auto;
      background: var(--paper);
      padding: 2.5rem 2.75rem 3rem;
      /* `dvh`, not `vh`: on iOS Safari `100vh` counts the URL bar as if it did
         not exist, so the sheet always overflows by about 60 px and the page
         scrolls with nothing to show. */
      min-height: 100dvh;
    }

    header.masthead { border-bottom: 2px solid var(--ink); padding-bottom: 1rem; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin: 0 0 0.4rem;
    }
    h1 { font-size: 1.7rem; line-height: 1.2; margin: 0 0 0.35rem; font-weight: 650; }
    .subline { color: var(--ink-dim); font-size: 0.92rem; margin: 0; }
    .coords { font-family: var(--font-mono); font-size: 0.82rem; color: var(--ink-faint); }

    /* This page also lives in an iframe laid over the globe. Without this line,
       a scroll that reaches the bottom of the sheet propagates to the parent
       document — that is, it triggers Android's “pull to refresh” on an app
       that has nothing to reload. */
    html, body { overscroll-behavior: contain; }

    form.lookup { display: flex; gap: 0.5rem; margin: 1.25rem 0 0; }
    form.lookup input {
      flex: 1;
      font: inherit;
      /* 16 px, and not `font: inherit` alone: below 16 px iOS Safari zooms the
         viewport on focus and never zooms back out. */
      font-size: 16px;
      padding: 0.5rem 0.7rem;
      border: 1px solid var(--rule);
      border-radius: 6px;
      background: var(--tint);
      color: var(--ink);
    }
    form.lookup button {
      font: inherit;
      font-weight: 600;
      padding: 0.5rem 1rem;
      border: 1px solid var(--accent);
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    form.lookup button.ghost { background: transparent; color: var(--accent); }

    .status {
      margin: 1.1rem 0 0;
      font-size: 0.85rem;
      color: var(--ink-dim);
      font-family: var(--font-mono);
    }

    .caveat {
      margin: 1.4rem 0 0;
      padding: 0.75rem 0.9rem;
      border-left: 3px solid var(--warn);
      background: #fff8ec;
      font-size: 0.86rem;
      color: #6b4a12;
    }

    section.theme { margin: 2.1rem 0 0; break-inside: avoid; }
    section.theme > h2 {
      font-size: 0.72rem;
      font-family: var(--font-mono);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 0 0 0.15rem;
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
    }
    section.theme[data-status="absent"] > h2 { color: var(--absent); }
    section.theme[data-status="partial"] > h2 { color: var(--warn); }
    section.theme > p.question {
      margin: 0 0 0.7rem;
      color: var(--ink-dim);
      font-size: 0.88rem;
    }

    dl.rows { margin: 0; display: grid; grid-template-columns: minmax(9rem, 1fr) minmax(6rem, auto); gap: 0; }
    dl.rows > div {
      display: contents;
    }
    dl.rows dt, dl.rows dd {
      border-top: 1px solid var(--rule);
      padding: 0.42rem 0;
      margin: 0;
      /* A grid cell has `min-width: auto` by default, so it refuses to shrink
         below the width of its longest word — and “Consommation énergétique
         primaire” overflows the column instead of wrapping. */
      min-width: 0;
      overflow-wrap: anywhere;
    }
    dl.rows dt { color: var(--ink-dim); padding-right: 1rem; }
    dl.rows dd { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
    dl.rows .note {
      grid-column: 1 / -1;
      border-top: 0;
      padding: 0 0 0.35rem;
      margin: -0.3rem 0 0;
      color: var(--ink-faint);
      font-size: 0.8rem;
      text-align: left;
    }

    ul.notes { margin: 0.75rem 0 0; padding-left: 1.1rem; color: var(--ink-dim); font-size: 0.84rem; }
    ul.notes li { margin: 0.2rem 0; }

    footer.colophon {
      margin: 3rem 0 0;
      padding-top: 1rem;
      border-top: 1px solid var(--rule);
      font-size: 0.78rem;
      color: var(--ink-faint);
    }
    footer.colophon a { color: var(--accent); }

    body.embed .sheet { padding: 1.25rem 1.25rem 2rem; min-height: 0; }
    body.embed form.lookup, body.embed .print { display: none; }

    /* 48rem and not 40. The breakpoint decided that at 640 px the sheet was
       still wide; yet the label column is a `minmax(9rem, 1fr)` and the value
       on the right a `minmax(6rem, auto)` — 15 rem of floor, plus the margins,
       before anything at all can shrink. Between 640 and 768 px the two
       columns squeezed together until the labels overflowed. `minmax(0, …)`
       on both sides is what finally lets the grid shrink. */
    @media (max-width: 48rem) {
      .sheet { padding: 1.5rem 1.1rem 2rem; }
      dl.rows { grid-template-columns: minmax(0, 1fr) minmax(0, auto); }
    }

    @media print {
      body { background: #fff; font-size: 11pt; }
      .sheet { max-width: none; padding: 0; }
      form.lookup, .print { display: none; }
      section.theme { break-inside: avoid; page-break-inside: avoid; }
      a[href]::after { content: " (" attr(href) ")"; font-size: 0.75em; color: #666; }
      .caveat { border-left-color: #666; background: #f4f4f4; color: #333; }
    }
  </style>
</head>
<body>
  <main class="sheet" id="sheet">
    <header class="masthead">
      <p class="eyebrow" data-i18n="masthead.eyebrow">Radiographie d’adresse</p>
      <h1 id="title" data-i18n="masthead.title">Une adresse, dix thématiques</h1>
      <!-- The sentence is a `<span>` of its own so the applicator rewrites it
           without emptying the full stop that closes the line after `<code>`:
           it moves an element's FIRST text node and blanks the others. -->
      <p class="subline" id="subline"><span data-i18n="masthead.subline">Entrez une adresse française, ou ouvrez cette page avec</span> <code translate="no">?lat=&amp;lon=</code>.</p>
    </header>
    <form class="lookup" id="lookup" autocomplete="off">
      <input id="query" name="q" type="search"
             placeholder="13 rue du Chevaleret, Paris" data-i18n-placeholder="lookup.example"
             aria-label="Adresse" data-i18n-aria-label="lookup.addressLabel">
      <button type="submit" data-i18n="lookup.scan">Scanner</button>
      <button type="button" class="ghost print" id="print" data-i18n="lookup.print">Imprimer</button>
    </form>
    <p class="status" id="status"></p>
    <div id="themes"></div>
    <footer class="colophon" id="colophon"></footer>
  </main>
  <script type="module" src="/src/fiche.js"></script>
</body>
</html>
